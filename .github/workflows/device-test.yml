# Photos Lock end-to-end tap test on an Android emulator.
# Workflows only. The app source is checked out at run time with a read-only
# deploy key (no credentials persisted), built as an x86_64 release APK, and
# driven by Maestro + adb. Everything the test produces (screenshots, logs,
# the build log) is encrypted before upload; the public page shows only
# PASS / FAIL lines.
name: device-test
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Photos-lock branch or commit
        default: main
permissions:
  contents: read
concurrency:
  group: device-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Mulhimfy/Photos-lock
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          persist-credentials: false
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - name: Build a release APK (x86_64, embedded bundle, no OTA check)
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cd app
          {
            npm ci --no-audit --no-fund
            node -e '
              const fs = require("fs"); const a = JSON.parse(fs.readFileSync("app.json", "utf8"));
              a.expo.updates = { ...a.expo.updates, checkAutomatically: "NEVER" };
              fs.writeFileSync("app.json", JSON.stringify(a, null, 2));'
            npx expo prebuild --platform android --no-install
            echo "org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=2g" >> android/gradle.properties
            (cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon -q)
          } > "$RUNNER_TEMP/out/build.log" 2>&1
          rc=$?
          git rev-parse --short HEAD > "$RUNNER_TEMP/out/commit.txt"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/app.apk" 2>/dev/null
          echo "build exit $rc, commit $(cat "$RUNNER_TEMP/out/commit.txt")"
          test -f "$RUNNER_TEMP/app.apk"
      - name: Free disk (the emulator needs room)
        run: |
          rm -rf app/node_modules app/android
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/lib/android/sdk/ndk
          df -h / | tail -1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 2048M
          heap-size: 256M
          disk-size: 4G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: bash ci/run.sh "$RUNNER_TEMP/app.apk" "$RUNNER_TEMP/out"
      - name: Results (public lines are PASS / FAIL only)
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(PASS|FAIL|INFO) ' "$RUNNER_TEMP/out/summary.txt" | cut -c1-120 >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Seal the outputs
        if: always()
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          mkdir -p sealed
          tar czf "$RUNNER_TEMP/out.tgz" -C "$RUNNER_TEMP" out
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:ARTIFACT_KEY -in "$RUNNER_TEMP/out.tgz" -out sealed/out.tgz.sealed
          rm -rf "$RUNNER_TEMP/out" "$RUNNER_TEMP/out.tgz" "$RUNNER_TEMP/app.apk" app
          ls -la sealed
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sealed
          path: sealed/out.tgz.sealed
          retention-days: 3
