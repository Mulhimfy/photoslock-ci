# Photos Lock test APK for a phone (arm64-v8a, release build, debug-signed).
# Workflows only: source by read-only deploy key, the APK is encrypted before
# upload, so nothing usable is public.
name: apk
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Photos-lock branch
        default: main
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Mulhimfy/Photos-lock
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          persist-credentials: false
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - name: Build (log kept private)
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cd app
          {
            npm ci --no-audit --no-fund
            node -e '
              const fs = require("fs"); const a = JSON.parse(fs.readFileSync("app.json", "utf8"));
              a.expo.updates = { ...a.expo.updates, checkAutomatically: "NEVER" };
              fs.writeFileSync("app.json", JSON.stringify(a, null, 2));'
            npx expo prebuild --platform android --no-install
            echo "org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=2g" >> android/gradle.properties
            echo 'gradle.taskGraph.whenReady { g -> g.allTasks.findAll { it.name.startsWith("lintVital") }.each { it.enabled = false } }' > "$RUNNER_TEMP/nolint.gradle"
            (cd android && ./gradlew -I "$RUNNER_TEMP/nolint.gradle" assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon -q)
          } > "$RUNNER_TEMP/out/build.log" 2>&1
          git rev-parse --short HEAD > "$RUNNER_TEMP/out/commit.txt"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/photoslock.apk"
          ls -la "$RUNNER_TEMP/out/photoslock.apk" | awk '{print $5" bytes"}'
      - name: Seal
        if: always()
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          mkdir -p sealed
          tar czf "$RUNNER_TEMP/out.tgz" -C "$RUNNER_TEMP" out
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:ARTIFACT_KEY -in "$RUNNER_TEMP/out.tgz" -out sealed/out.tgz.sealed
          rm -rf "$RUNNER_TEMP/out" "$RUNNER_TEMP/out.tgz" app
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sealed
          path: sealed/out.tgz.sealed
          retention-days: 2
