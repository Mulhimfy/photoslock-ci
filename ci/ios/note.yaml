appId: com.photo-locked.app
---
# iOS reads a row's label with its count ("Secure Notes, 0"): patterns, not exact text.
# A new secure note: sealed on save by notesCipher.ios.js, so by CryptoKit. The
# title alone is enough: the whole note (title, body, pin) is sealed as one.
- tapOn: "Library"
- extendedWaitUntil:
    visible: "Secure Notes.*"
    timeout: 10000
- tapOn: "Secure Notes.*"
- extendedWaitUntil:
    visible: ".*New Note.*"
    timeout: 10000
- tapOn: ".*New Note.*"
- tapOn: "Title.*"
- inputText: "CI sealed note"
# The keyboard's one-time slide-to-type tip.
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- tapOn: "Back"
- extendedWaitUntil:
    visible: ".*CI sealed note.*"
    timeout: 10000
- takeScreenshot: i10_note_saved
