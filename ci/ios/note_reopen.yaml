appId: com.photo-locked.app
---
# iOS reads a row's label with its count ("Secure Notes, 0"): patterns, not exact text.
# Relaunch, unlock, open the note again: its title in the list and in the
# editor was read back from the file and opened by CryptoKit.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Enter Passcode|Enter your passcode|Unlock"
    timeout: 60000
- tapOn: "1"
- tapOn: "2"
- tapOn: "3"
- tapOn: "4"
- extendedWaitUntil:
    visible: "Albums"
    timeout: 20000
- tapOn: "Library"
- extendedWaitUntil:
    visible: "Secure Notes.*"
    timeout: 10000
- tapOn: "Secure Notes.*"
- extendedWaitUntil:
    visible: ".*CI sealed note.*"
    timeout: 10000
- tapOn: ".*CI sealed note.*"
- extendedWaitUntil:
    visible: "Delete note"
    timeout: 10000
- assertVisible: "CI sealed note"
- takeScreenshot: i11_note_reopened
