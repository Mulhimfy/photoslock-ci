appId: com.photoslocked.app
---
# Browser → a download link (a picture served as an attachment) → the vault's
# own save sheet comes up instead of a download to the public folder.
- tapOn: "Browser"
- tapOn: "Search .* or type a URL"
- waitForAnimationToEnd:
    timeout: 2000
# The first key can be lost while the keyboard comes up (11-21: "ttps://…"
# became a search): a leading space takes that place, and the app trims it.
- inputText: " https://github.com/Mulhimfy/photoslock-ci/releases/download/test-assets/pl_dl.png"
- pressKey: Enter
# The sheet, or one of the browser's two answers to a download it refuses.
- extendedWaitUntil:
    visible: "Save Picture|Save Video|Only photos and videos can go in the vault|Could not save that"
    timeout: 45000
- takeScreenshot: s110_download_answer
- assertVisible: "Save Picture"
