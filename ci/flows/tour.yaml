appId: com.photoslocked.app
---
# Every tab, and the Library / Settings screens in and out (system back).
- tapOn: "Library"
- extendedWaitUntil:
    visible: "Secure Notes"
    timeout: 8000
- takeScreenshot: s80_library
- tapOn: "Secure Notes"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: s81_notes
- back
- extendedWaitUntil:
    visible: "Collections"
    timeout: 8000
- tapOn: "Browser"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: s82_browser
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Change Passcode"
    timeout: 8000
- takeScreenshot: s83_settings
- tapOn: "Decoy Vault"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: s84_decoy
- back
- extendedWaitUntil:
    visible: "Change Passcode"
    timeout: 8000
- tapOn: "Break-in Report"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: s85_breakin
- back
- extendedWaitUntil:
    visible: "Change Passcode"
    timeout: 8000
# A switch, on and off (the row's text and the switch share a label).
- tapOn:
    text: "Lock When Face-Down"
    index: 1
    optional: true
- tapOn:
    text: "Lock When Face-Down"
    index: 1
    optional: true
- scrollUntilVisible:
    element: "Space Saver"
    direction: DOWN
    timeout: 10000
- tapOn: "Space Saver"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s86_storage
- back
- scrollUntilVisible:
    element: "Recently Deleted"
    direction: DOWN
    timeout: 10000
- tapOn: "Recently Deleted"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: s87_trash
- back
- extendedWaitUntil:
    visible: "Space Saver"
    timeout: 8000
- tapOn: "Albums"
- extendedWaitUntil:
    visible: "Add"
    timeout: 8000
