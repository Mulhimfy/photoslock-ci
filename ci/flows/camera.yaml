appId: com.photoslocked.app
---
# + → Camera opens the camera app; back returns; + still works.
- tapOn: "Add"
- extendedWaitUntil:
    visible: "Camera"
    timeout: 3000
- tapOn: "Camera"
- runFlow:
    when:
      visible: "While using the app|Only this time|Allow"
    commands:
      - tapOn: "While using the app|Only this time|Allow"
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible: "Albums"
- takeScreenshot: s30_camera_open
- back
- extendedWaitUntil:
    visible: "Albums"
    timeout: 10000
- takeScreenshot: s31_back_from_camera
- tapOn: "Add"
- extendedWaitUntil:
    visible: "Import Photos"
    timeout: 3000
- takeScreenshot: s32_dial_after_camera
- tapOn: "Close"
