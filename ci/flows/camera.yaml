appId: com.photoslocked.app
---
# + → Camera → deny the permission → our dialog → Not Now; + still works.
- tapOn: "Add"
- extendedWaitUntil:
    visible: "Camera"
    timeout: 3000
- tapOn: "Camera"
- extendedWaitUntil:
    visible: "Deny|Don’t allow|Don't allow"
    timeout: 8000
- takeScreenshot: s30_camera_permission
- tapOn: "Deny|Don’t allow|Don't allow"
- extendedWaitUntil:
    visible: "Camera Access Needed"
    timeout: 5000
- takeScreenshot: s31_our_dialog
- doubleTapOn: "Not Now"
- extendedWaitUntil:
    notVisible: "Camera Access Needed"
    timeout: 5000
- tapOn: "Add"
- extendedWaitUntil:
    visible: "Import Photos"
    timeout: 3000
- takeScreenshot: s32_dial_after_dialog
- tapOn: "Close"
